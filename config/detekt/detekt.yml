build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true

comments:
  active: true
  excludes:
    - "**/test/**"
    - "**/androidTest/**"

complexity:
  active: true
  LongMethod:
    active: true
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
  CyclomaticComplexMethod:
    excludes:
      - "**/EbbTokens.kt"

coroutines:
  active: true

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated:
      - Composable

performance:
  active: true

potential-bugs:
  active: true

style:
  active: true
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
    excludes:
      - "**/EbbTokens.kt"
  ReturnCount:
    max: 2
    excludes:
      - "**/TodayScreen.kt"
  NewLineAtEndOfFile:
    active: true
    excludes:
      - "**/test/**"
  MagicNumber:
    active: false
  WildcardImport:
    active: true