name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle verify
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew --stacktrace \
            ktlintCheck \
            detekt \
            lintDebug \
            testDebugUnitTest \
            verifyPaparazziDebug \
            assembleDebug

      - name: Build onboarding side-by-side comparisons
        run: |
          python3 -m pip install --quiet Pillow
          python3 tools/generate_onboarding_comparisons.py
          python3 tools/generate_screen_comparisons.py

      - name: Upload onboarding comparisons
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-comparisons
          path: build/onboarding-comparisons/
          retention-days: 30

      - name: Upload screen comparisons
        uses: actions/upload-artifact@v4
        with:
          name: screen-comparisons
          path: build/screen-comparisons/
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ebb-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish debug APK pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${GITHUB_SHA::7}"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          gh release view debug-latest >/dev/null 2>&1 || \
            gh release create debug-latest "$APK" --title "Ebb debug (latest)" --notes "Automated debug build from main." --prerelease
          gh release upload debug-latest "$APK" --clobber
          gh release create "ebb-debug-$SHA" "$APK" --title "Ebb debug $SHA" --notes "Commit ${GITHUB_SHA}" --prerelease || \
            gh release upload "ebb-debug-$SHA" "$APK" --clobber