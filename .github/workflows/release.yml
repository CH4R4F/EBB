name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match version.properties, e.g. v0.1.0)"
        required: true
        type: string

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Resolve release tag
        id: release_tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${DISPATCH_TAG}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}

      - name: Verify tag matches version.properties
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [[ "$TAG" != v* ]]; then
            echo "Expected a semver tag vMAJOR.MINOR.PATCH, got: $TAG"
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          VERSION_MAJOR=$(sed -n 's/^VERSION_MAJOR=//p' version.properties | tr -d '[:space:]')
          VERSION_MINOR=$(sed -n 's/^VERSION_MINOR=//p' version.properties | tr -d '[:space:]')
          VERSION_PATCH=$(sed -n 's/^VERSION_PATCH=//p' version.properties | tr -d '[:space:]')
          VERSION_NAME="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "Tag version ($TAG_VERSION) does not match version.properties ($VERSION_NAME)"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Require release signing secrets
        env:
          EBB_KEYSTORE_BASE64: ${{ secrets.EBB_KEYSTORE_BASE64 }}
          EBB_KEYSTORE_PASSWORD: ${{ secrets.EBB_KEYSTORE_PASSWORD }}
          EBB_KEY_ALIAS: ${{ secrets.EBB_KEY_ALIAS }}
          EBB_KEY_PASSWORD: ${{ secrets.EBB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in EBB_KEYSTORE_BASE64 EBB_KEYSTORE_PASSWORD EBB_KEY_ALIAS EBB_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing GitHub Actions secrets for release signing: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions (see docs/RELEASING.md)."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release keystore
        env:
          EBB_KEYSTORE_BASE64: ${{ secrets.EBB_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/ebb-release.jks"
          echo "$EBB_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "EBB_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          EBB_KEYSTORE_PASSWORD: ${{ secrets.EBB_KEYSTORE_PASSWORD }}
          EBB_KEY_ALIAS: ${{ secrets.EBB_KEY_ALIAS }}
          EBB_KEY_PASSWORD: ${{ secrets.EBB_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease

      - name: Prepare release artifact
        run: |
          set -euo pipefail
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          DEST="ebb-v${VERSION_NAME}.apk"
          cp "$SRC" "$DEST"
          ls -la "$SRC" "$DEST"
          echo "RELEASE_APK=$DEST" >> "$GITHUB_ENV"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebb-release-apk
          path: ebb-v${{ env.VERSION_NAME }}.apk
          retention-days: 5

  publish-release:
    needs: build-release-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Resolve release tag
        id: release_tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${DISPATCH_TAG}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          TAG_VERSION="${TAG#v}"
          VERSION_MAJOR=$(sed -n 's/^VERSION_MAJOR=//p' version.properties 2>/dev/null || true)
          if [ -z "$VERSION_MAJOR" ]; then
            VERSION_NAME="${TAG_VERSION}"
          else
            VERSION_MINOR=$(sed -n 's/^VERSION_MINOR=//p' version.properties | tr -d '[:space:]')
            VERSION_PATCH=$(sed -n 's/^VERSION_PATCH=//p' version.properties | tr -d '[:space:]')
            VERSION_NAME="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: ebb-release-apk

      - name: Build release notes from CHANGELOG
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          if awk -v ver="$VERSION_NAME" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | grep -q .; then
            awk -v ver="$VERSION_NAME" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          else
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="${{ github.sha }}" \
              --jq .body > "$NOTES_FILE"
          fi
          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
          echo "RELEASE_APK=ebb-v${VERSION_NAME}.apk" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          test -f "$RELEASE_APK"
          gh release create "$RELEASE_TAG" \
            "$RELEASE_APK" \
            --title "Ebb v${VERSION_NAME}" \
            --notes-file "$NOTES_FILE"