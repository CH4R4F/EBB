name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match version.properties, e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Resolve release tag
        id: release_tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}

      - name: Verify tag matches version.properties
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [[ "$TAG" != v* ]]; then
            echo "Expected a semver tag vMAJOR.MINOR.PATCH, got: $TAG"
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          VERSION_MAJOR=$(sed -n 's/^VERSION_MAJOR=//p' version.properties | tr -d '[:space:]')
          VERSION_MINOR=$(sed -n 's/^VERSION_MINOR=//p' version.properties | tr -d '[:space:]')
          VERSION_PATCH=$(sed -n 's/^VERSION_PATCH=//p' version.properties | tr -d '[:space:]')
          VERSION_NAME="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "Tag version ($TAG_VERSION) does not match version.properties ($VERSION_NAME)"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble debug APK
        run: |
          test -f app/debug.keystore
          ./gradlew --stacktrace assembleDebug

      - name: Prepare release APK
        run: |
          set -euo pipefail
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          DEST="ebb-v${VERSION_NAME}-debug.apk"
          cp "$SRC" "$DEST"
          echo "RELEASE_APK=$DEST" >> "$GITHUB_ENV"

      - name: Build release notes from CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          if awk -v ver="$VERSION_NAME" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | grep -q .; then
            awk -v ver="$VERSION_NAME" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          else
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="${{ github.sha }}" \
              --jq .body > "$NOTES_FILE"
          fi
          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RELEASE_APK" \
            --title "Ebb v${VERSION_NAME}" \
            --notes-file "$NOTES_FILE"